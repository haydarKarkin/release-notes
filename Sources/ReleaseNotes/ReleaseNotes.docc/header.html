<style>
  :host {
    --bg: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0, 0, 0, 0.1);
    --accent: hsl(211, 80%, 42%);
  }
  :host([data-color-scheme="dark"]) {
    --bg: #000000;
    --ink: #f5f5f7;
    --muted: #a1a1a6;
    --line: rgba(255, 255, 255, 0.16);
    --accent: hsl(211, 80%, 62%);
  }
  @media (prefers-color-scheme: dark) {
    :host([data-color-scheme="auto"]) {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --line: rgba(255, 255, 255, 0.16);
      --accent: hsl(211, 80%, 62%);
    }
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 22px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .me {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    color: var(--ink);
    text-decoration: none;
  }
  .me img {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--line);
  }
  .me span { display: grid; line-height: 1.25; min-width: 0; }
  .me strong { font-size: 15px; font-weight: 600; }
  .me small { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 18px; flex: none; }
  nav a { font-size: 14px; color: var(--accent); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    header { padding: 8px 16px; }
    .me small { display: none; }
    nav { gap: 14px; }
  }
</style>
