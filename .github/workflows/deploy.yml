name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Swift version
        run: swift --version
      - name: Build DocC
        run: |
          mkdir -p ./docs
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target ReleaseNotes \
            --output-path ./docs \
            --transform-for-static-hosting
      - name: Add root redirect
        run: |
          cat > ./docs/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Haydar Karkin</title>
            <link rel="canonical" href="https://haydarkarkin.com/documentation/releasenotes/">
            <meta http-equiv="refresh" content="0; url=/documentation/releasenotes/">
          </head>
          <body>
            <p>Redirecting to <a href="/documentation/releasenotes/">haydarkarkin.com/documentation/releasenotes/</a>...</p>
          </body>
          </html>
          HTML
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true